<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — Patente Nautica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;600&family=EB+Garamond:ital,wght@1,400;1,500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sea:#DEEAEF;--paper:#FBF8F1;--land:#EADFC4;
    --deep:#0E2A38;--sound:#6F9AA8;--magenta:#B8306E;
    --rule:rgba(14,42,56,.16);--ok:#1a7a4a;--err:#c0392b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--sea);
    background-image:
      repeating-linear-gradient(to right,rgba(111,154,168,.18) 0 1px,transparent 1px 64px),
      repeating-linear-gradient(to bottom,rgba(111,154,168,.18) 0 1px,transparent 1px 64px);
    color:var(--deep);
    font-family:"IBM Plex Sans",-apple-system,sans-serif;
    font-size:16px;line-height:1.6;
    min-height:100vh;
  }

  /* NAV */
  nav{
    background:var(--deep);display:flex;align-items:center;justify-content:space-between;
    padding:0 28px;height:54px;position:sticky;top:0;z-index:100;
    box-shadow:0 2px 12px rgba(14,42,56,.28);
  }
  .nav-logo{font-family:"Oswald",sans-serif;font-weight:600;font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:var(--sea);text-decoration:none}
  .nav-topic{font-family:"Oswald",sans-serif;font-weight:300;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--sound)}

  /* PROGRESS BAR */
  .progress-bar{height:4px;background:rgba(111,154,168,.3);position:fixed;top:54px;left:0;right:0;z-index:99}
  .progress-fill{height:100%;background:var(--magenta);transition:width .4s ease;width:0%}

  /* SCREENS */
  .screen{display:none;min-height:calc(100vh - 54px)}
  .screen.active{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px}

  /* INTRO */
  .intro-card{
    background:var(--paper);border:1px solid var(--rule);border-radius:2px;
    padding:40px 36px 36px;max-width:540px;width:100%;
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset;
    text-align:center;
  }
  .eyebrow{font-family:"Oswald",sans-serif;font-weight:500;letter-spacing:.28em;text-transform:uppercase;font-size:12px;color:var(--magenta);margin-bottom:14px}
  .intro-card h1{font-family:"Oswald",sans-serif;font-weight:300;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(26px,5vw,40px);line-height:1.05;margin-bottom:.3em}
  .intro-card h1 b{font-weight:600}
  .intro-sub{font-family:"EB Garamond",Georgia,serif;font-style:italic;font-size:18px;color:#2c4d5c;margin-bottom:32px}
  .intro-meta{
    display:flex;gap:0;border:1px solid var(--rule);border-radius:2px;margin-bottom:32px;overflow:hidden;
  }
  .intro-stat{flex:1;padding:14px 12px;text-align:center;border-right:1px solid var(--rule)}
  .intro-stat:last-child{border-right:none}
  .stat-n{font-family:"Oswald",sans-serif;font-weight:600;font-size:26px;color:var(--magenta);display:block;line-height:1}
  .stat-l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sound);margin-top:3px;display:block}
  .btn-start{
    font-family:"Oswald",sans-serif;font-weight:500;font-size:15px;letter-spacing:.18em;text-transform:uppercase;
    background:var(--deep);color:var(--sea);border:none;border-radius:2px;padding:14px 36px;cursor:pointer;
    width:100%;transition:background .15s;
  }
  .btn-start:hover{background:#1a4a62}

  /* QUIZ */
  .quiz-wrap{max-width:580px;width:100%;padding-top:20px}
  .q-meta{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:16px;
    font-family:"Oswald",sans-serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--sound);
  }
  .q-card{
    background:var(--paper);border:1px solid var(--rule);border-radius:2px;padding:28px 26px 24px;
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset;margin-bottom:14px;
  }
  .q-text{
    font-family:"Oswald",sans-serif;font-weight:300;font-size:clamp(17px,3.5vw,22px);
    letter-spacing:.02em;line-height:1.35;color:var(--deep);margin-bottom:24px;
  }
  .q-opts{display:flex;flex-direction:column;gap:10px}
  .opt-btn{
    font-family:"IBM Plex Sans",sans-serif;font-size:15px;text-align:left;
    background:var(--sea);border:1.5px solid var(--rule);border-radius:2px;
    padding:13px 16px;cursor:pointer;color:var(--deep);
    transition:background .12s,border-color .12s,transform .1s;
    line-height:1.4;
  }
  .opt-btn:hover:not(:disabled){background:var(--land);border-color:var(--sound);transform:translateX(3px)}
  .opt-btn:disabled{cursor:default}
  .opt-btn.correct{background:rgba(26,122,74,.12);border-color:var(--ok);color:var(--ok);font-weight:600}
  .opt-btn.wrong{background:rgba(192,57,43,.10);border-color:var(--err);color:var(--err)}

  /* FEEDBACK */
  .q-feedback{
    margin-top:18px;padding:14px 16px;border-radius:2px;font-size:15px;line-height:1.5;
    display:none;
  }
  .q-feedback.correct{background:rgba(26,122,74,.1);border:1px solid rgba(26,122,74,.3);color:var(--ok)}
  .q-feedback.wrong{background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.25);color:var(--err)}
  .q-feedback .tip{
    font-family:"EB Garamond",Georgia,serif;font-style:italic;font-size:15px;
    color:var(--deep);margin-top:8px;display:block;
  }

  /* NEXT BUTTON */
  .btn-next{
    font-family:"Oswald",sans-serif;font-weight:500;font-size:13px;letter-spacing:.18em;text-transform:uppercase;
    background:var(--deep);color:var(--sea);border:none;border-radius:2px;padding:13px 28px;
    cursor:pointer;width:100%;transition:background .15s;display:none;
  }
  .btn-next:hover{background:#1a4a62}

  /* RESULT */
  .result-card{
    background:var(--paper);border:1px solid var(--rule);border-radius:2px;
    padding:48px 40px 40px;max-width:480px;width:100%;
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset;text-align:center;
  }
  .result-grade{
    font-family:"Oswald",sans-serif;font-weight:600;
    font-size:clamp(56px,15vw,88px);color:var(--magenta);line-height:1;
    margin-bottom:4px;
  }
  .result-total{
    font-family:"Oswald",sans-serif;font-weight:300;
    font-size:18px;letter-spacing:.1em;text-transform:uppercase;color:var(--sound);
    margin-bottom:20px;
  }
  .result-msg{
    font-family:"EB Garamond",Georgia,serif;font-style:italic;
    font-size:20px;color:#2c4d5c;margin-bottom:32px;
  }
  .result-actions{display:flex;gap:12px;flex-direction:column}
  .btn-retry{
    font-family:"Oswald",sans-serif;font-weight:500;font-size:13px;letter-spacing:.18em;text-transform:uppercase;
    background:var(--deep);color:var(--sea);border:none;border-radius:2px;padding:13px 28px;
    cursor:pointer;transition:background .15s;
  }
  .btn-retry:hover{background:#1a4a62}
  .btn-home{
    font-family:"Oswald",sans-serif;font-weight:500;font-size:13px;letter-spacing:.18em;text-transform:uppercase;
    background:transparent;color:var(--magenta);border:1.5px solid var(--magenta);border-radius:2px;
    padding:13px 28px;text-decoration:none;display:block;transition:background .15s,color .15s;
  }
  .btn-home:hover{background:var(--magenta);color:#fff}
  .btn-study{
    font-family:"Oswald",sans-serif;font-weight:300;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--sound);text-decoration:none;margin-top:8px;display:block;
  }
  .btn-study:hover{color:var(--deep)}

  /* BEST SCORE */
  .best-score{
    font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sound);
    margin-top:24px;font-family:"Oswald",sans-serif;
  }
  .best-score span{color:var(--magenta);font-weight:600}
</style>
</head>
<body>

<nav>
  <a href="../index.html" class="nav-logo">Nautica</a>
  <span class="nav-topic" id="nav-topic"></span>
</nav>

<div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>

<!-- ── INTRO ── -->
<div class="screen active" id="screen-intro">
  <div class="intro-card">
    <div class="eyebrow" id="intro-eyebrow">Quiz</div>
    <h1 id="intro-h1">Caricamento…</h1>
    <p class="intro-sub" id="intro-sub"></p>
    <div class="intro-meta">
      <div class="intro-stat">
        <span class="stat-n" id="intro-nq">—</span>
        <span class="stat-l">Domande</span>
      </div>
      <div class="intro-stat">
        <span class="stat-n">4</span>
        <span class="stat-l">Opzioni</span>
      </div>
      <div class="intro-stat">
        <span class="stat-n" id="intro-best">—</span>
        <span class="stat-l">Best score</span>
      </div>
    </div>
    <button class="btn-start" onclick="avvia()">Inizia il quiz →</button>
  </div>
</div>

<!-- ── QUIZ ── -->
<div class="screen" id="screen-quiz">
  <div class="quiz-wrap">
    <div class="q-meta">
      <span id="q-num">1 / 5</span>
      <span id="q-score-live">0 corrette</span>
    </div>
    <div class="q-card">
      <p class="q-text" id="q-text"></p>
      <div class="q-opts" id="q-opts"></div>
      <div class="q-feedback" id="q-feedback"></div>
    </div>
    <button class="btn-next" id="btn-next" onclick="prossima()">Prossima →</button>
  </div>
</div>

<!-- ── RESULT ── -->
<div class="screen" id="screen-result">
  <div class="result-card">
    <div class="result-grade" id="res-num">—</div>
    <div class="result-total" id="res-total">su — domande</div>
    <p class="result-msg" id="res-msg"></p>
    <div class="result-actions">
      <button class="btn-retry" onclick="avvia()">Riprova</button>
      <a href="../index.html" class="btn-home">← Torna al portale</a>
      <a id="res-study-link" href="#" class="btn-study">Rileggi l'argomento →</a>
    </div>
    <p class="best-score" id="best-label"></p>
  </div>
</div>

<script src="domande.js"></script>
<script>
/* ── STATO ── */
let arg = '', domande = [], idx = 0, score = 0, risposto = false;

const STUDY_LINKS = {
  normativa:    '../argomenti/01-normativa.html',
  meteorologia: '../argomenti/02-meteorologia.html',
  navigazione:  '../argomenti/03-navigazione.html',
  segnalamento: '../argomenti/04-segnalamento.html',
  sicurezza:    '../argomenti/05-sicurezza.html',
  manovre:      '../argomenti/06-manovre.html',
  motore:       '../argomenti/07-motore.html',
  vela:         '../vela/index.html',
  scafo:        '../argomenti/09-scafo.html',
};

/* ── INIT ── */
(function init() {
  arg = new URLSearchParams(location.search).get('arg') || 'normativa';
  domande = (DOMANDE[arg] || []).slice();
  const titolo = TITOLI[arg] || arg;

  document.getElementById('nav-topic').textContent = titolo;
  document.getElementById('intro-eyebrow').textContent = 'Quiz · ' + arg;
  setH1(titolo, document.getElementById('intro-h1'));
  document.getElementById('intro-sub').textContent = 'Rispondi a ogni domanda e scopri il tuo punteggio.';
  document.getElementById('intro-nq').textContent = domande.length;

  const scores = JSON.parse(localStorage.getItem('quiz-scores') || '{}');
  const best = scores[arg];
  document.getElementById('intro-best').textContent = best ? best.score + '/' + best.total : '—';

  document.getElementById('res-study-link').href = STUDY_LINKS[arg] || '../index.html';
})();

function setH1(titolo, el) {
  const parts = titolo.split('—');
  if (parts.length > 1) {
    el.innerHTML = parts[0].trim() + '<br><b>' + parts[1].trim() + '</b>';
  } else {
    el.textContent = titolo;
  }
}

/* ── AVVIA ── */
function avvia() {
  idx = 0; score = 0; risposto = false;
  domande = mescola((DOMANDE[arg] || []).slice());
  mostraSchermata('quiz');
  mostraDomanda();
}

/* ── MOSTRA DOMANDA ── */
function mostraDomanda() {
  risposto = false;
  const d = domande[idx];
  const tot = domande.length;

  document.getElementById('q-num').textContent = (idx + 1) + ' / ' + tot;
  document.getElementById('q-score-live').textContent = score + ' corrette';
  document.getElementById('prog-fill').style.width = (idx / tot * 100) + '%';
  document.getElementById('q-text').textContent = d.q;
  document.getElementById('q-feedback').style.display = 'none';
  document.getElementById('q-feedback').className = 'q-feedback';
  document.getElementById('btn-next').style.display = 'none';

  const optsEl = document.getElementById('q-opts');
  optsEl.innerHTML = '';
  d.opts.forEach(function(opt, i) {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.onclick = function() { seleziona(i); };
    optsEl.appendChild(btn);
  });
}

/* ── SELEZIONE RISPOSTA ── */
function seleziona(i) {
  if (risposto) return;
  risposto = true;

  const d = domande[idx];
  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach(function(btn) { btn.disabled = true; });
  btns[d.correct].classList.add('correct');
  if (i !== d.correct) btns[i].classList.add('wrong');

  const corretto = i === d.correct;
  if (corretto) score++;

  const fb = document.getElementById('q-feedback');
  fb.className = 'q-feedback ' + (corretto ? 'correct' : 'wrong');
  fb.innerHTML = (corretto ? '<strong>Corretto!</strong>' : '<strong>Risposta errata.</strong> La risposta giusta è: <em>' + d.opts[d.correct] + '</em>') +
    (d.tip ? '<span class="tip">' + d.tip + '</span>' : '');
  fb.style.display = 'block';

  const btnNext = document.getElementById('btn-next');
  btnNext.style.display = 'block';
  btnNext.textContent = idx === domande.length - 1 ? 'Vedi risultato →' : 'Prossima →';

  document.getElementById('q-score-live').textContent = score + ' corrette';
}

/* ── PROSSIMA ── */
function prossima() {
  idx++;
  if (idx >= domande.length) {
    mostraRisultato();
  } else {
    mostraDomanda();
  }
}

/* ── RISULTATO ── */
function mostraRisultato() {
  const tot = domande.length;
  const pct = Math.round(score / tot * 100);

  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('res-num').textContent = score;
  document.getElementById('res-total').textContent = 'su ' + tot + ' domande · ' + pct + '%';

  let msg;
  if (pct >= 90) msg = 'Eccellente! Sei pronto per l\'esame.';
  else if (pct >= 70) msg = 'Buono! Ripassia ancora qualche punto e riprova.';
  else if (pct >= 50) msg = 'Sufficiente. Rileggi le schede e riprova.';
  else msg = 'Dai un\'altra lettura all\'argomento, poi riprova.';
  document.getElementById('res-msg').textContent = msg;

  /* salva in localStorage */
  const scores = JSON.parse(localStorage.getItem('quiz-scores') || '{}');
  const prev = scores[arg];
  const isNew = !prev || score > prev.score;
  if (isNew) {
    scores[arg] = { score: score, total: tot, pct: pct, date: new Date().toLocaleDateString('it-IT') };
    localStorage.setItem('quiz-scores', JSON.stringify(scores));
  }
  document.getElementById('best-label').innerHTML = isNew
    ? 'Nuovo record! <span>' + score + '/' + tot + '</span>'
    : 'Miglior punteggio: <span>' + (prev ? prev.score + '/' + prev.total : score + '/' + tot) + '</span>';

  mostraSchermata('result');
}

/* ── UTILS ── */
function mostraSchermata(id) {
  document.querySelectorAll('.screen').forEach(function(el) {
    el.classList.remove('active');
  });
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo(0, 0);
}

function mescola(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
</script>
</body>
</html>
